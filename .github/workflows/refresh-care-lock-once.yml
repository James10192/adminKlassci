name: "Temporary: refresh Care security lock"
on:
  push:
    branches:
      - fix/care-dark-mobile-notifications-20261029
    paths:
      - .github/workflows/refresh-care-lock-once.yml
permissions:
  contents: write
jobs:
  composer-security-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/care-dark-mobile-notifications-20261029
          persist-credentials: true
      - name: PHP 8.3 with Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, iconv, xml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Update only the affected Composer dependencies
        run: composer update phpoffice/phpspreadsheet symfony/http-foundation symfony/mime --with-all-dependencies --no-scripts --no-plugins --no-interaction --no-progress
      - name: Verify production audit on updated lock
        run: composer audit --locked --no-dev --abandoned=ignore
      - name: Commit the generated lock
        run: |
          if git diff --quiet -- composer.lock; then
            echo "Composer lock unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "build(security): refresh PhpSpreadsheet and Symfony patched dependencies"
          git push origin HEAD:refs/heads/fix/care-dark-mobile-notifications-20261029
