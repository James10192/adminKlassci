name: Diagnose presentation once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/presentation-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sonder presentation et le proxy public
        run: |
          set -u
          probe() {
            url="$1"
            echo "===== $url ====="
            curl -sS -L --max-time 25 \
              -D /tmp/headers.txt \
              -o /tmp/body.txt \
              -w 'HTTP=%{http_code} TOTAL=%{time_total}s FINAL=%{url_effective}\n' \
              "$url" || true
            echo '--- headers ---'
            sed -n '1,80p' /tmp/headers.txt || true
            echo '--- body ---'
            sed -n '1,80p' /tmp/body.txt || true
            echo
          }

          probe 'https://presentation.klassci.com/'
          probe 'https://presentation.klassci.com/login'
          probe 'https://presentation.klassci.com/esbtp/reinscription'
          probe 'https://presentation.klassci.com/_e2e/reinscription-student'
          probe 'https://www.klassci.com/fr/inscription/universite/presentation'
