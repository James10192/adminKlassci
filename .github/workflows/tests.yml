name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  pest:
    name: Pest on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 = la production (LWS, CloudLinux PHP Selector) ;
        # 8.4 = le poste de developpement. On teste ce qui existe vraiment.
        php: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, dom, pdo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Copy environment file
        run: cp .env.example .env

      - name: Create storage directories
        run: mkdir -p storage/framework/{cache,sessions,views,testing} bootstrap/cache

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        run: php artisan key:generate --ansi

      # Toute la suite, Unit ET Feature : les tests Feature tournent sur SQLite
      # en memoire (voir phpunit.xml), donc aucun service de base a demarrer.
      # Les jouer ici est le seul endroit ou ils sont verifies avant la fusion.
      - name: Run the full Pest suite
        run: ./vendor/bin/pest --colors=always
